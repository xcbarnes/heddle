# Crate policy (v01_architecture.md §5.9), in force before the first crate.
# Adding a crate means adding it to `bans.allow` below in the same commit, and
# a crate with a build script must also be named in `allow-build-scripts`.

[graph]
all-features = true
# The platforms Fabric builds for. A dependency behind `cfg(any())`, which
# serde's crates use to pin versions, matches none of them and is never built.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
allow-workspace = true
# The allow-list. Allowed by the spec, to be added only when used:
# fabric-core and fabric-wire: sha2, ed25519-dalek (verify only), no_std.
# Elsewhere: serde, serde_json (harness payloads and settings files only),
# getrandom, and one safe wrapper for the sleep-counting monotonic clock.
# Dev-only: regex (differential tests of the hand-written matchers), proptest.
allow = [
  # heddle: harness payloads (serde_json 1.0.154, 2026-10-11) and what it builds.
  "serde_json",
  "serde_core",
  "itoa",
  "memchr",
  "zmij",
]

[bans.build]
# Each one runs code at build time, so each is named. zmij is serde_json's
# float formatter; its build script was flagged by this check on 2026-11-13.
allow-build-scripts = ["serde_json", "serde_core", "zmij"]
executables = "deny"
include-dependencies = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
