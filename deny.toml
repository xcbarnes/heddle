# Crate policy (v01_architecture.md §5.9), in force before the first crate.
# Adding a crate means adding it to `bans.allow` below in the same commit, and
# a crate with a build script must also be named in `allow-build-scripts`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
allow-workspace = true
# The allow-list. Allowed by the spec, to be added only when used:
# fabric-core and fabric-wire: sha2, ed25519-dalek (verify only), no_std.
# Elsewhere: serde, serde_json (harness payloads and settings files only),
# getrandom, and one safe wrapper for the sleep-counting monotonic clock.
# Dev-only: regex (differential tests of the hand-written matchers), proptest.
allow = []

[bans.build]
allow-build-scripts = []
executables = "deny"
include-dependencies = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
