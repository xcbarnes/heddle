[package]
name = "fabric-core"
description = "Fabric's pure core: every rule as a total function, no I/O, no clock, no panics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The only two crates the core may use (crate policy), without the standard
# library. ed25519-dalek is used to verify only, in the core.
sha2 = { version = "=0.11.1", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false }

[lints]
workspace = true
