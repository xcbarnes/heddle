name: ci

# Secrets: GitHub's own secret scanning and push protection, both on for this
# public repository, cover every push. There are no third-party crates to
# audit: the first step below fails if one appears.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain, pinned by rust-toolchain.toml
        run: rustup toolchain install && cargo --version && rustc --version
      - name: Cargo.lock lists only this workspace's own packages
        shell: bash
        run: |
          diff <(sed -n 's/^name = "\(.*\)"$/\1/p' Cargo.lock | sort) \
               <(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[].name' | sort)
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: The core builds for WebAssembly without the standard library
        run: cargo build -p fabric-core --target wasm32-unknown-unknown --locked --release
      - name: The JSON reader against Python's json, every decoded string byte for byte
        run: spec/jsondiff/run.sh 100000

  # The macOS binary, for local end-to-end tests only. An installed binary
  # comes from a tagged, attested release.
  heddle-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && cargo build --release --locked -p heddle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heddle-aarch64-apple-darwin-test-only
          path: target/release/heddle
          retention-days: 7

  # Parked until the room model is updated for the seamless design.
  quint:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Quint 0.33.1, pinned by SHA-256
        run: |
          curl -fsSLo "$RUNNER_TEMP/quint" https://github.com/informalsystems/quint/releases/download/v0.33.1/quint-linux-amd64
          echo "acd153075b7edc6fc8f889930c5ff3ebdf94ada381a45a26a2d41b18b9f10db7  $RUNNER_TEMP/quint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/quint" && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: quint typecheck spec/quint/room.qnt
      - name: Random runs of the room model, every invariant checked after every step
        run: quint run spec/quint/room.qnt --invariant=inv --max-samples=2000 --max-steps=40 --seed=0x1
